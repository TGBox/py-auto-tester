[project]
name = "py-auto-tester"
version = "0.2.0"
description = "GUI und CLI zum Aufnehmen, Strukturieren und Ausführen von Playwright-Webtests"
readme = "README.md"
authors = [
    { name = "Daniel Rösch" }
]
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6.0",
    "playwright>=1.40.0",
]

# PEP 735: uv installiert diese Gruppe bei "uv sync" und "uv run" von selbst.
# Als [project.optional-dependencies] waere sie es NICHT — dann findet
# "uv run pytest" kein pytest im venv und faellt auf das System-Python
# zurueck, dem die Projektabhaengigkeiten fehlen.
[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
# Ein Befehl für alles: "py-auto-tester gui" startet die Oberfläche,
# "py-auto-tester run <ziel>" führt kopflos aus.
py-auto-tester = "py_auto_tester.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
# src/ auf den Importpfad, damit die Tests ohne Installation laufen
pythonpath = ["src"]
testpaths = ["test_app.py", "tests"]
norecursedirs = ["scratch", "project_data", ".venv", "src"]
markers = [
    "e2e: startet einen echten Browser (abwaehlbar mit -m 'not e2e')",
]
